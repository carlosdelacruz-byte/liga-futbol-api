# Infraestructura como codigo para Render.
# Con este archivo en la raiz, Render crea el servicio web y la base de
# datos con "New > Blueprint" apuntando al repositorio.

databases:
  - name: liga-futbol-db
    databaseName: liga_futbol
    user: liga_futbol_user
    plan: free

services:
  - type: web
    name: liga-futbol-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DB_NAME
        fromDatabase:
          name: liga-futbol-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: liga-futbol-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: liga-futbol-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: liga-futbol-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: liga-futbol-db
          property: port
      - key: DB_SSLMODE
        value: require
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.10"
